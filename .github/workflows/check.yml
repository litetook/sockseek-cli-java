name: check

# Windows, because that is the only platform this tool has been measured on - and because
# the snapshot recording holds Windows paths and CRLF, so only here can the gate COMPARE
# rather than merely re-record. The pins in dependencies.yaml cover macOS and Linux and the
# code has no Windows-only branch left in it, but neither has been run, and a workflow that
# claims otherwise would be the tool lying about itself. A Linux job is worth adding the day
# somebody wants to support Linux.
#
# The fourth gate, tools/gates/mock.py, is deliberately absent: it drives the real sockseek
# binary, which is 114 MB and is not kept in the repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests
        run: ./gradlew.bat --no-daemon test

      - name: Build the jar
        run: ./gradlew.bat --no-daemon fatJar

      - name: The manuals match the options
        run: python tools/gates/docs.py

      - name: The whole tool over every playlist, against the recording
        run: python tools/gates/snapshot.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sockseek-cli.jar
          path: build/libs/sockseek-cli.jar
