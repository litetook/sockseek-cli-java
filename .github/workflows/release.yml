name: release

# Push a tag, get a release. The jar people download is built by GitHub from the tagged
# commit, not uploaded from somebody's laptop - so what is in the release is what is in the
# repository, and anyone can check that by building it themselves.
#
#   git tag -a v1.2.3 -m "sockseek-cli 1.2.3" && git push origin v1.2.3
#
# Windows, for the same reason as the check workflow: it is the platform this has been
# measured on, and the snapshot recording can only be compared there. The jar itself is
# platform-independent.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: the existing tag to build a release for
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # a release that fails its own checks is worse than no release
      - run: ./gradlew.bat --no-daemon check

      - name: The jar says the version the tag does
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          SAID=$(java -jar build/libs/sockseek-cli.jar --version)
          echo "tag $TAG, jar said '$SAID'"
          test "$SAID" = "sockseek-cli ${TAG#v}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" build/libs/sockseek-cli.jar \
            --title "sockseek-cli ${TAG#v}" \
            --generate-notes
